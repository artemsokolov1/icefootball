[/Script/EngineSettings.GameMapsSettings]
; The skating prototype is isolated: its own game mode, selected per map (World Settings override,
; see Content/Python/create_ice_skate_map.py) or per launch URL with the alias below:
;   UnrealEditor IceFootball.uproject /Engine/Maps/Entry?game=skate -game
; The global default game mode is intentionally NOT changed.
+GameModeClassAliases=(Name="skate",GameMode="/Script/IceFootball.SkateGameMode")

[/Script/Engine.Engine]
; Lets the prototype's FPS-cap toggle (D-pad Down / F3) reach the requested rates.
bSmoothFrameRate=false
