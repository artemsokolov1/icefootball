[/Script/EngineSettings.GameMapsSettings]
; This project is the skating prototype: pressing Play on ANY map starts the skating mode
; (the rink, ball and lighting are built at runtime and placed on top of existing ground).
; A map can still override it in World Settings > GameMode Override.
GlobalDefaultGameMode=/Script/IceFootball.SkateGameMode
; Alias for command-line launches:  UnrealEditor IceFootball.uproject /Engine/Maps/Entry?game=skate -game
+GameModeClassAliases=(Name="skate",GameMode="/Script/IceFootball.SkateGameMode")

[/Script/Engine.Engine]
; Lets the prototype's FPS-cap toggle (D-pad Down / F3) reach the requested rates.
bSmoothFrameRate=false

